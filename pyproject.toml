[project]
name = "ligue1-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Perone-Eng", email = "felipeperone.eng@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
ligue1-predictor = "ligue1_predictor:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
